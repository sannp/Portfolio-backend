services:
  - type: web
    name: portfolio-backend
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: DB_CONNECTION
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: API_SECRET
        generateValue: true
      # Portfolio App Database (Aiven PostgreSQL)
      - key: PORTFOLIO_DB_HOST
        sync: false
      - key: PORTFOLIO_DB_PORT
        value: 5432
      - key: PORTFOLIO_DB_NAME
        sync: false
      - key: PORTFOLIO_DB_USER
        sync: false
      - key: PORTFOLIO_DB_PASS
        sync: false
      - key: PORTFOLIO_DB_SSL
        value: true
      # Legacy support (deprecated)
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_DATABASE
        sync: false
      - key: POSTGRES_USERNAME
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
