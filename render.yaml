services:
  - type: web
    name: portfolio-backend
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_CONNECTION
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: API_SECRET
        generateValue: true
      # Portfolio App Database (Aiven PostgreSQL)
      - key: PORTFOLIO_DB_HOST
        sync: false
      - key: PORTFOLIO_DB_PORT
        value: 5432
      - key: PORTFOLIO_DB_NAME
        sync: false
      - key: PORTFOLIO_DB_USER
        sync: false
      - key: PORTFOLIO_DB_PASS
        sync: false
      - key: PORTFOLIO_DB_SSL
        value: true
      # Legacy support (deprecated)
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_DATABASE
        sync: false
      - key: POSTGRES_USERNAME
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      # n8n Configuration
      - key: N8N_ENABLED
        value: true
      - key: N8N_PORT
        value: 5678
      - key: N8N_PATH
        value: /n8n/
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_BASIC_AUTH_ACTIVE
        value: true
      - key: N8N_BASIC_AUTH_USER
        sync: false
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      # n8n Database (reuses PORTFOLIO_DB_* by default)
      - key: N8N_DB_NAME
        value: n8n
      - key: DB_TYPE
        value: postgresdb
